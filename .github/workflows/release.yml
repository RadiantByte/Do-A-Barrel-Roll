name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-client-android-arm64-v8a
          path: artifacts/android
      - uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            artifacts/android/DoABarrelRoll.so
            artifacts/android/DoABarrelRoll.levipack
