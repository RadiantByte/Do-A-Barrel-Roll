name: Build

on:
  pull_request:
  push:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: xmake-io/github-action-setup-xmake@v1
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          local-cache: true
      - uses: actions/cache@v6
        with:
          path: ~/.xmake
          key: xmake-android-arm64-r28c-${{ hashFiles('xmake.lua', 'xmake/*.lua') }}
          restore-keys: xmake-android-arm64-r28c-
      - name: Configure Android
        run: xmake f -y -p android -a arm64-v8a -m release --ndk="$ANDROID_NDK_HOME" --ndk_sdkver=28
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      - name: Build Android
        run: xmake -y
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-client-android-arm64-v8a
          if-no-files-found: error
          path: |
            bin/DoABarrelRoll.so
            bin/DoABarrelRoll.levipack
